# Grype configuration for the vulnerability scans in .github/workflows/ci.yml
# (blocking, critical) and .github/workflows/docker.yml (informational, high),
# passed explicitly through the `config` input. Sharing one file means a warning
# on the published image is always a finding nobody has looked at yet.
#
# A finding belongs here only when it cannot be fixed from this repository.
# Every rule names the exact package version, so it stops matching, and the scan
# fails again, as soon as that component is upgraded. Re-check the entries
# whenever Google publishes a new cmdline-tools package (the weekly
# dependency-drift workflow reports a newer cmdline-tools build).
ignore:
  # bcprov-jdk18on 1.80.2 is bundled by Google inside the Android cmdline-tools
  # package (cmdline-tools;latest, revision 23.0), which sdkmanager installs.
  # Google has not shipped a build with a newer Bouncy Castle, and swapping jars
  # inside the SDK is not supported. Bouncy Castle advisories are fixed only in
  # newer library releases, so any advisory against this version would block
  # every pull request with nothing to fix here. Known ones when this rule was
  # added (all fixed in 1.85):
  #   GHSA-9pwp-9qqc-pr26  critical  Name Constraints bypass in certificate
  #                                  validation
  #   GHSA-qp49-qgx5-5m26  high      ASN.1 nesting-depth guard reset
  # Risk accepted: the jar is only used by the SDK's own command-line tools on
  # the developer's machine, which this image is not a service for.
  - package:
      name: bcprov-jdk18on
      version: "1.80.2"
      type: java-archive

  # Google's cmdline-tools package (the same one as above) also bundles a Kotlin
  # compiler jar for the SDK's lint tool, with these libraries shaded inside it.
  # Fixed upstream in jline 3.30.x and protobuf-java 3.25.5; nothing here can change
  # a jar inside the Android SDK. All are high severity (not blocking in CI), only
  # reachable through the SDK's own command-line tools on the developer's machine.
  - package:
      name: jline-builtins
      version: "3.24.1"
      type: java-archive
  - package:
      name: jline-remote-telnet
      version: "3.24.1"
      type: java-archive
  - package:
      name: protobuf-java
      version: "2.6.1"
      type: java-archive

  # npm's own bundled dependencies in the node base image (npm 11.19.0 ships these
  # versions inside /usr/local/lib/node_modules/npm). The image only runs npm at
  # build time, to install firebase-tools, and not as a service. The newest npm
  # (12.x) is a new major and still bundles undici 6.28.0, below the fixed 6.28.1,
  # so upgrading npm here would not clear the findings. They go away when the Node
  # base image ships a newer npm, which the node digest bump picks up. The rules are
  # scoped to npm's own directory, so the same package inside firebase-tools'
  # dependency tree is never hidden (it is audited by the npm audit job).
  - package:
      name: brace-expansion
      version: "5.0.7"
      type: npm
      location: "/usr/local/lib/node_modules/npm/**"
  - package:
      name: ip-address
      version: "10.2.0"
      type: npm
      location: "/usr/local/lib/node_modules/npm/**"
  - package:
      name: tar
      version: "7.5.19"
      type: npm
      location: "/usr/local/lib/node_modules/npm/**"
  - package:
      name: undici
      version: "6.27.0"
      type: npm
      location: "/usr/local/lib/node_modules/npm/**"
