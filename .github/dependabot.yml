# .github/dependabot.yml
version: 2

updates:
  # ── GitHub Actions ────────────────────────────────────────
  # Actions are pinned to full commit SHAs; Dependabot rewrites the SHA and the
  # trailing "# vX.Y.Z" comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    target-branch: "develop"
    rebase-strategy: "auto"
    # Wait a week after an upstream release before proposing it, so a
    # compromised or broken release can be yanked before it reaches a PR.
    cooldown:
      default-days: 7
    assignees:
      - "alihaidar0"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  # ── Docker ────────────────────────────────────────────────
  # Every dependency in the Dockerfile is version-checked EXCEPT
  # Node — it is intentionally pinned to 24 (Active LTS) and
  # excluded from all Dependabot updates; upgraded manually.
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    target-branch: "develop"
    rebase-strategy: "auto"
    cooldown:
      default-days: 7
    assignees:
      - "alihaidar0"
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker:
        patterns:
          - "*"
    ignore:
      - dependency-name: "node"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"
    open-pull-requests-limit: 3
