# .github/workflows/dependency-drift.yml
#
# Dependabot cannot see the tools pinned in docker/Dockerfile.dev
# (firebase-tools, pnpm, Starship, the Android cmdline-tools build, the node
# base digest) nor the actionlint version pinned in ci.yml. This workflow
# compares those pins with their official release channels every week and keeps
# a single issue up to date; the issue closes itself once everything is current.
# A failed scheduled run opens or updates the issue "Unattended image run failed".
name: Dependency drift

on:
  schedule:
    # Off the top of the hour, when GitHub delays or drops scheduled runs.
    - cron: "47 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Check pinned versions
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            docker/Dockerfile.dev
            .github/scripts
            .github/npm-audit-allowlist.txt
            .github/workflows/ci.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Compare pins with upstream
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ runner.temp }}/drift-report.md
        run: python3 .github/scripts/check_drift.py "$REPORT"

      - name: Add report to job summary
        env:
          REPORT: ${{ runner.temp }}/drift-report.md
        run: cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DRIFT: ${{ steps.check.outputs.drift }}
          REPORT: ${{ runner.temp }}/drift-report.md
          TITLE: "Dependency drift: pinned tool versions are behind upstream"
        run: |
          number="$(gh issue list --state open --label dependencies --limit 100 \
            --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")"

          if [ "$DRIFT" = "true" ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file "$REPORT"
              echo "Updated issue #$number" >> "$GITHUB_STEP_SUMMARY"
            else
              gh issue create --title "$TITLE" --label dependencies --body-file "$REPORT"
              echo "Opened a new drift issue" >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "All pinned versions are current again."
            echo "Closed issue #$number" >> "$GITHUB_STEP_SUMMARY"
          fi

  # A scheduled run has no author to notify, so keep one open issue instead; each
  # new failure comments on it. Close it once the weekly run is green again.
  report-failure:
    name: Report a failed weekly run
    needs: drift
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write   # open the tracking issue, or comment on it
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Unattended image run failed"
        run: |
          body="The weekly Dependency drift run failed: ${RUN_URL}"
          body="${body}"$'\n\n'"Fix the cause and re-run it (or wait for the next weekly run), then close this issue."
          number="$(gh issue list --state open --label bug --limit 100 \
            --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
            echo "Commented on issue #$number" >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue create --title "$TITLE" --label bug --body "$body"
            echo "Opened the tracking issue" >> "$GITHUB_STEP_SUMMARY"
          fi
