# .github/workflows/dockerhub-description.yml
name: Docker Hub Description

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/workflows/dockerhub-description.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-description:
    name: Update Docker Hub Description
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Docker Hub credentials live in this environment; restrict it to the
    # `main` branch in Settings → Environments (see docs/github-setup.md).
    environment: docker-hub
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: README.md
          persist-credentials: false

      - name: Check image exists on Docker Hub
        id: check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/flutter-devcontainer/")
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Docker Hub description
        if: steps.check.outputs.exists == 'true'
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/flutter-devcontainer
          readme-filepath: ./README.md

      - name: Write job summary
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          IMAGE_EXISTS: ${{ steps.check.outputs.exists }}
        run: |
          {
            echo "## 📄 Docker Hub Description Summary"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **Triggered by** | \`${EVENT_NAME}\` on \`${REF_NAME}\` |"
            echo "| **Commit** | \`${COMMIT_SHA}\` |"
            echo "| **Image exists** | \`${IMAGE_EXISTS}\` |"
            echo "| **Docker Hub updated** | \`${IMAGE_EXISTS}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
