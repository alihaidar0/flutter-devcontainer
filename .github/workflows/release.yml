# .github/workflows/release.yml
#
# Reusable workflow, called by docker.yml after an image has been published to
# Docker Hub. Every release is named after the image it describes: the release
# tag is the image tag (flutter-X.Y.Z.R), so a release, its git tag and its
# Docker image always share one name. A release is created for every push to main
# that changes the image and for every new Flutter release picked up by the
# weekly rebuild (revision 1); other rebuilds only add an image revision.
name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: "Image tag, also used as the release tag (flutter-X.Y.Z.R)"
        required: true
        type: string
      flutter_version:
        description: "Flutter release baked into the image"
        required: true
        type: string
      image:
        description: "Docker Hub repository the image was published to"
        required: true
        type: string
      digest:
        description: "Digest of the published manifest list"
        required: true
        type: string

permissions: {}

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          TAG: ${{ inputs.tag }}
          FLUTTER_VERSION: ${{ inputs.flutter_version }}
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::Release $TAG already exists and is left untouched."
            exit 0
          fi
          notes="$(printf '%s\n' \
            "Docker image for Flutter ${FLUTTER_VERSION}:" \
            "" \
            '```bash' \
            "docker pull ${IMAGE}:${TAG}" \
            '```' \
            "" \
            "Digest: \`${DIGEST}\`" \
            "")"
          gh release create "$TAG" \
            --target "$TARGET_SHA" \
            --title "$TAG" \
            --notes "$notes" \
            --generate-notes \
            --latest
          echo "Published release $TAG" >> "$GITHUB_STEP_SUMMARY"
