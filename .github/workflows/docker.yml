# .github/workflows/docker.yml
#
# Publishes the multi-platform image to Docker Hub. Pull-request validation
# (build + smoke tests on both architectures) lives in ci.yml.
name: Docker

on:
  push:
    branches:
      - main
    paths:
      - "docker/Dockerfile.dev"
      - "scripts/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push image to Docker Hub?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      force_rebuild:
        description: "Bypass layer cache (full rebuild)"
        required: false
        type: boolean
        default: false

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: alihaidar199527/flutter-devcontainer

jobs:
  build-and-push:
    name: Build & Push Dev Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Docker Hub credentials live in this environment; restrict it to the
    # `main` branch in Settings → Environments (see docs/github-setup.md).
    environment: docker-hub
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.dev
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push_image == 'true') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: ${{ inputs.force_rebuild == true }}
          build-args: |
            NODE_VERSION=24
          provenance: true
          sbom: true

      - name: Write job summary
        if: always()
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          PUSHED: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push_image == 'true') }}
        run: |
          {
            echo "## 🐦 Docker Build Summary"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **Image** | \`${IMAGE_NAME}\` |"
            echo "| **Digest** | \`${DIGEST}\` |"
            echo "| **Tags** | \`${TAGS}\` |"
            echo "| **Platforms** | \`linux/amd64, linux/arm64\` |"
            echo "| **Triggered by** | \`${EVENT_NAME}\` on \`${REF_NAME}\` |"
            echo "| **Commit** | \`${COMMIT_SHA}\` |"
            echo "| **Pushed to Docker Hub** | \`${PUSHED}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
