# .github/workflows/docker.yml
#
# Publishes the multi-platform image to Docker Hub. Pull-request validation
# (build + smoke tests on both architectures) lives in ci.yml.
#
# Flow: each architecture is built natively (no QEMU), smoke-tested, and only
# then pushed by digest. A final job merges the two digests into one manifest
# list, tags it and signs it with a keyless Sigstore signature.
name: Docker

on:
  push:
    branches:
      - main
    paths:
      - "docker/**"
      - "scripts/**"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  # There is deliberately no schedule: an image is published only when a change to
  # the image is merged to main (the paths above are everything the build copies or
  # reads), or by a manual run. New upstream versions arrive as pull requests to
  # develop (Dependabot, Renovate) and in the dependency-drift issue.
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push image to Docker Hub?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      force_rebuild:
        description: "Bypass layer cache (full rebuild)"
        required: false
        type: boolean
        default: false

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: alihaidar199527/flutter-devcontainer
  # A manual run with push_image=false is a dry run; every other trigger publishes.
  PUSH: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image == 'true' }}

jobs:
  build:
    name: Build & test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # Docker Hub credentials live in this environment; restrict it to the
    # `main` branch in Settings → Environments (see docs/github-setup.md).
    environment: docker-hub
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}

      # The registry cache keeps the (very large) layers out of the 10 GB
      # GitHub Actions cache, which the pull-request builds already use.
      # A forced rebuild imports no cache at all; the push step below still
      # reuses what this step just built, because BuildKit keeps its cache for
      # the whole job.
      - name: Build image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.dev
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: flutter-devcontainer:test
          build-args: |
            NODE_VERSION=24
          cache-from: ${{ inputs.force_rebuild != true && format('type=registry,ref={0}:buildcache-{1}', env.IMAGE_NAME, matrix.arch) || '' }}

      - name: Smoke test
        run: bash .github/scripts/smoke-test.sh flutter-devcontainer:test

      # Informational: the blocking scan runs on pull requests (ci.yml). Here it
      # documents what the published image contains without holding back a
      # security refresh of the base image.
      - name: Scan image for vulnerabilities
        if: matrix.arch == 'amd64'
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: flutter-devcontainer:test
          config: .github/grype.yaml
          fail-build: false
          severity-cutoff: high
          only-fixed: true
          output-format: table

      - name: Read Flutter version
        id: flutter
        run: |
          version="$(docker run --rm flutter-devcontainer:test flutter --version --machine 2>/dev/null | jq -r .frameworkVersion)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Could not determine the Flutter version (got '$version')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Same build as above (BuildKit keeps its cache for the whole job), pushed
      # by digest with SBOM and maximum-detail provenance attestations.
      - name: Push by digest
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.dev
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_VERSION=24
          cache-from: ${{ inputs.force_rebuild != true && format('type=registry,ref={0}:buildcache-{1}', env.IMAGE_NAME, matrix.arch) || '' }}
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      - name: Export digest
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          FLUTTER_VERSION: ${{ steps.flutter.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
          echo "$FLUTTER_VERSION" > "$RUNNER_TEMP/digests/flutter-$ARCH"

      - name: Upload digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Every published image gets a permanent flutter-X.Y.Z.R name: X.Y.Z is the Flutter
  # release baked into the image and R is the image revision of that release. R is
  # the first number that is free on Docker Hub AND for which GitHub lets the git tag
  # be created (a name used by an immutable release stays reserved for good, even
  # after the release was deleted). The tag is created here, before anything is
  # pushed, so the image, the git tag and the release can never disagree. The dotted
  # numeric form lets Dependabot in consuming repositories order and bump it.
  reserve-tag:
    name: Reserve the image tag
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.push_image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Creating the git tag is the only reason for contents: write; no secret is used.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.revision.outputs.tag }}
      revision: ${{ steps.revision.outputs.number }}
      flutter_version: ${{ steps.flutter.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Resolve Flutter version
        id: flutter
        env:
          DIGESTS: ${{ runner.temp }}/digests
        run: |
          versions="$(cat "$DIGESTS"/flutter-* | sort -u)"
          if [ "$(printf '%s\n' "$versions" | wc -l)" -ne 1 ]; then
            echo "::error::The architectures built different Flutter versions:"
            printf '%s\n' "$versions"
            exit 1
          fi
          echo "version=$versions" >> "$GITHUB_OUTPUT"

      - name: Pick the next free revision and reserve its git tag
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE: ${{ env.IMAGE_NAME }}
          FLUTTER_VERSION: ${{ steps.flutter.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: bash .github/scripts/reserve-tag.sh

  merge:
    name: Publish multi-platform manifest
    needs: [build, reserve-tag]
    if: github.event_name != 'workflow_dispatch' || inputs.push_image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: docker-hub
    permissions:
      contents: read
      # Keyless signing: the job proves its identity to Sigstore with an OIDC token.
      id-token: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest             moving pointer to the newest build (the only moving tag)
      # flutter-X.Y.Z.R    immutable: Flutter release X.Y.Z, image revision R
      # The commit that built an image is not a tag: it is in the image's
      # org.opencontainers.image.revision label and in the job summary.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ needs.reserve-tag.outputs.tag }}

      - name: Create manifest list and push
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          # Only the files named after a digest (64 hex characters) are image digests.
          sources="$(find . -maxdepth 1 -type f -regextype posix-extended -regex '\./[0-9a-f]{64}' -printf "${IMAGE_NAME}@sha256:%f ")"
          test "$(wc -w <<< "$sources")" -eq 2
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $sources
          # Resolve the digest through a tag this run just created, whatever the trigger.
          first_tag="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          digest="$(docker buildx imagetools inspect "$first_tag" --format '{{json .Manifest}}' | jq -r .digest)"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"

      - name: Write job summary
        if: always()
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          FLUTTER_VERSION: ${{ needs.reserve-tag.outputs.flutter_version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "## 🐦 Docker Build Summary"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **Image** | \`${IMAGE_NAME}\` |"
            echo "| **Digest** | \`${DIGEST}\` |"
            echo "| **Tags** | \`$(tr '\n' ' ' <<< "$TAGS")\` |"
            echo "| **Flutter** | \`${FLUTTER_VERSION}\` |"
            echo "| **Platforms** | \`linux/amd64, linux/arm64\` (built natively) |"
            echo "| **Signed** | Sigstore keyless (Cosign) |"
            echo "| **Triggered by** | \`${EVENT_NAME}\` on \`${REF_NAME}\` |"
            echo "| **Commit** | \`${COMMIT_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # The GitHub Release is named after the image it describes (flutter-X.Y.Z.R) and is
  # created from the git tag reserved above. It is created for every push to main that
  # changes the image and for the first image of a new Flutter release (a manual run);
  # other manual runs only add an image revision.
  release:
    name: Release
    needs: [reserve-tag, merge]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || needs.reserve-tag.outputs.revision == '1')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.reserve-tag.outputs.tag }}
      flutter_version: ${{ needs.reserve-tag.outputs.flutter_version }}
      image: alihaidar199527/flutter-devcontainer
      digest: ${{ needs.merge.outputs.digest }}
